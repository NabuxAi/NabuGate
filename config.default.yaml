# NabuGate — default config baked into the Docker image (/app/config.yaml).
#
# This file contains no secrets. Gateway and provider keys are injected through
# environment variables at runtime. Providers without an available key are
# skipped automatically.

server:
  port: 8080
  api_keys:
    - "${NABU_API_KEY}"
  keys:
    # NabuWrite. One glob covers its three write-* agents and the write-embed
    # alias, so the project key cannot reach any other model on the gateway.
    # Skipped automatically when NABUWRITE_KEY is unset.
    - key: "${NABUWRITE_KEY}"
      project: "nabuwrite"
      allow: ["write-*"]
      rate_limit: 120

    # Dadebaran (dadebaran.ir) presents the gateway catalogue as its model
    # picker, so its allow-list is what its users can choose from. It is broad
    # on purpose — but it is a project key, not the admin key: usage is
    # attributed to "dadebaran" in /v1/usage and a leak cannot administer the
    # gateway. Skipped automatically when DADEBARAN_KEY is unset.
    - key: "${DADEBARAN_KEY}"
      project: "dadebaran"
      allow: ["nabu-*", "parspack/*", "avalai/*", "gapgpt/*", "gpt-*", "o1", "o3", "o3-mini", "o4-mini", "deepseek-*", "kimi-*", "minimax-*", "glm-*"]
      rate_limit: 240

providers:
  openai:
    enabled: true
    type: openai
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"

  groq:
    enabled: true
    type: openai
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"

  openrouter:
    enabled: true
    type: openai
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"

  # Cloudflare Workers AI (developers.cloudflare.com/workers-ai) — OpenAI-wire
  # serverless inference (Llama / gpt-oss / Qwen / Mistral / DeepSeek / bge). The
  # account id is templated into base_url; auth is a Bearer token. Both
  # CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_KEY are required — skipped when the
  # key is unset. passthrough exposes "cloudflare/@cf/<author>/<model>"; Workers
  # AI has no /v1/models, so the static list below is what /v1/models advertises.
  cloudflare:
    enabled: true
    type: openai
    base_url: "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"
    api_key_env: "CLOUDFLARE_API_KEY"
    passthrough: true
    models:
      - "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      - "@cf/meta/llama-3.1-8b-instruct"
      - "@cf/openai/gpt-oss-120b"
      - "@cf/baai/bge-large-en-v1.5"

  # TokenRouter (api.tokenrouter.io) — OpenAI-wire router fronting 300+ models
  # (OpenAI / Claude / Gemini / Llama / DeepSeek / GLM …) with "auto:*" routing.
  # passthrough exposes "tokenrouter/<model>" (e.g. tokenrouter/glm-5.2,
  # tokenrouter/auto:balance); its /v1/models feeds live discovery. Skipped when
  # TOKENROUTER_API_KEY is unset.
  tokenrouter:
    enabled: true
    type: openai
    base_url: "https://api.tokenrouter.io/v1"
    api_key_env: "TOKENROUTER_API_KEY"
    passthrough: true

  dahl:
    enabled: true
    type: openai
    base_url: "https://inference.dahl.global/v1"
    api_key_env: "DAHL_API_KEY"

  parspack:
    enabled: true
    type: openai
    base_url: "https://my.parspack.com/api/aistudio/api/v1"
    api_key_env: "PARSPACK_API_KEY"
    # Parspack AI Studio is not a single model — it is a provider hosting many.
    # passthrough lets callers address any of them directly as
    # "parspack/<model>" (e.g. "parspack/openai/gpt-5.5") with no per-model
    # alias, and surfaces its whole catalogue on /v1/models via live discovery
    # of the provider's own /v1/models endpoint. Grant access with
    # allow: ["parspack/*"] on a project key.
    passthrough: true

  # AvalAI (avalai.ir) — OpenAI-wire aggregator (GPT / Claude / Gemini / Qwen /
  # Llama / Mistral / Grok / DeepSeek / …) with rial billing. Fully OpenAI
  # compatible, so passthrough discovery surfaces its catalogue as "avalai/*".
  # Skipped automatically when AVALAI_API_KEY is unset.
  avalai:
    enabled: true
    type: openai
    base_url: "https://api.avalai.ir/v1"
    api_key_env: "AVALAI_API_KEY"
    passthrough: true

  # GapGPT (gapgpt.app) — OpenAI-wire aggregator, rial billing. passthrough
  # exposes its catalogue as "gapgpt/*"; the static models are a curated
  # fallback for /v1/models. Skipped when GAPGPT_API_KEY is unset.
  gapgpt:
    enabled: true
    type: openai
    base_url: "https://api.gapgpt.app/v1"
    api_key_env: "GAPGPT_API_KEY"
    passthrough: true
    models:
      - "gpt-5.6-sol"
      - "gpt-5.6-luna"
      - "claude-sonnet-5"
      - "gemini-3.1-pro-preview"
      - "deepseek-v4-pro"

  # ArvanCloud AIaaS (arvancloud.ir) — private per-model endpoint on Iranian
  # infra. OpenAI-wire chat body, but auth is "apikey <key>" not "Bearer", hence
  # auth_scheme. Set ARVAN_AIAAS_ENDPOINT to your endpoint URL and ARVAN_API_KEY
  # to its access key; skipped when either is unset. Not passthrough (one model).
  arvan:
    enabled: true
    type: openai
    base_url: "${ARVAN_AIAAS_ENDPOINT}"
    api_key_env: "ARVAN_API_KEY"
    auth_scheme: "apikey"

  # 9Router — an OpenAI-compatible smart router you SELF-HOST, fronting 60+
  # providers (Claude Code, Codex, Gemini, GLM, MiniMax, Kimi, Qwen, …) with its
  # own 3-tier fallback. It is software, not a SaaS, which is why NabuGate's
  # compose bundles it as a `ninerouter` service rather than just naming a URL.
  #
  # Two separate steps, and only the first is automated:
  #   1. run it            — the compose service does this
  #   2. connect providers — a ONE-TIME manual step in its dashboard, which
  #                          holds OAuth tokens and API keys. Until that is
  #                          done every model answers "No active credentials".
  #
  # base_url comes from env because "localhost" is wrong once NabuGate runs in a
  # container: inside the distroless image localhost is the gateway itself.
  #   • bundled service:            http://ninerouter:20128/v1
  #   • same host, no container:    http://localhost:20128/v1
  #   • gateway in Docker on host:  http://host.docker.internal:20128/v1
  # Unset → provider auto-skipped, so the gateway still boots without it.
  #
  # Keyless: the local endpoint ignores the adapter's placeholder bearer.
  # Multi-model + OpenAI-wire ⇒ passthrough, addressable as "9router/<model>"
  # with its catalogue discovered live from /v1/models.
  9router:
    enabled: true
    type: openai
    base_url: "${NINEROUTER_BASE_URL}"
    passthrough: true

  anthropic:
    enabled: true
    type: anthropic
    base_url: "https://api.anthropic.com/v1"
    api_key_env: "ANTHROPIC_API_KEY"

  gemini:
    enabled: true
    type: gemini
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    api_key_env: "GEMINI_API_KEY"

  # Pexels stock photos as an image source. An image alias pointed here searches
  # Pexels for the prompt and returns real photos. Skipped when PEXELS_API_KEY
  # is unset, like any other keyed provider.
  pexels:
    enabled: true
    type: pexels
    base_url: "https://api.pexels.com/v1"
    api_key_env: "PEXELS_API_KEY"

  ollama:
    enabled: true
    type: openai
    base_url: "${OLLAMA_BASE_URL}"

# Model registry — a model is an identity, not a provider coordinate.
#
# "gpt-5.5" is the same model whether Parspack, AvalAI or GapGPT serves it, and
# each spells the upstream name differently. Declaring it once here means an
# alias can name the model alone: the router expands it into one attempt per
# serving provider, in this order, skipping any provider without a live key.
#
# The effect is that a provider going down switches to the next one serving the
# same model, silently — the caller asked for a model and gets that model.
#
# param_style belongs to the model, so it is declared once and inherited by
# every provider serving it.
model_registry:
  gpt-5.5:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-5.5"
      - provider: avalai
        model: "gpt-5.5"
      - provider: gapgpt
        model: "gpt-5.5"
      - provider: openai
        model: "gpt-5.5"

  gpt-4o-mini:
    serves:
      - provider: parspack
        model: "openai/gpt-4o-mini"
      - provider: avalai
        model: "gpt-4o-mini"
      - provider: gapgpt
        model: "gpt-4o-mini"
      - provider: openai
        model: "gpt-4o-mini"

  gpt-4o:
    serves:
      - provider: parspack
        model: "openai/gpt-4o-2024-11-20"
      - provider: avalai
        model: "gpt-4o"
      - provider: openai
        model: "gpt-4o"

  gpt-4.1-mini:
    serves:
      - provider: parspack
        model: "openai/gpt-4.1-mini"
      - provider: avalai
        model: "gpt-4.1-mini"

  gpt-4.1-nano:
    serves:
      - provider: parspack
        model: "openai/gpt-4.1-nano"

  deepseek-v4-pro:
    serves:
      - provider: parspack
        model: "deepseek/deepseek-v4-pro"
      - provider: gapgpt
        model: "deepseek-v4-pro"

  kimi-k2.6:
    serves:
      - provider: dahl
        model: "moonshotai/Kimi-K2.6"
      - provider: parspack
        model: "moonshotai/kimi-k2.6"

  minimax-m2.7:
    serves:
      - provider: dahl
        model: "MiniMaxAI/MiniMax-M2.7"
      - provider: parspack
        model: "minimax/minimax-m2.7"

  glm-5.2:
    serves:
      - provider: parspack
        model: "z-ai/glm-5.2"
      - provider: tokenrouter
        model: "glm-5.2"

  gpt-oss-20b:
    serves:
      - provider: parspack
        model: "openai/gpt-oss-20b"
      - provider: cloudflare
        model: "@cf/openai/gpt-oss-120b"


  # The remaining reasoning-dialect models found by probing the catalogue. They
  # are listed so their dialect is declared: a client that sends max_tokens —
  # which most do — otherwise gets an HTML 502 from the provider and no useful
  # error. The dialect is not guessable from the name, which is why every one of
  # these was verified by probe, including both search-preview models.
  gpt-5:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-5"
      - provider: avalai
        model: "gpt-5"

  gpt-5-mini:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-5-mini"

  gpt-5.3-chat:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-5.3-chat"

  o1:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/o1"
      - provider: avalai
        model: "o1"

  o3:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/o3"
      - provider: avalai
        model: "o3"

  o3-mini:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/o3-mini"

  o4-mini:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/o4-mini"

  gpt-4o-search-preview:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-4o-search-preview"

  gpt-4o-mini-search-preview:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-4o-mini-search-preview"


models:
  nabu-fast:
    primary:
      model: minimax-m2.7
    fallback:
      - model: gpt-4o-mini
      - model: gpt-4.1-mini


  nabu-smart:
    primary:
      model: kimi-k2.6
    fallback:
      - model: gpt-5.5
      - model: gpt-4o
      - model: deepseek-v4-pro


  nabu-cheap:
    primary:
      model: gpt-4.1-nano
    fallback:
      - model: gpt-4o-mini
      - model: gpt-oss-20b


  nabu-vision:
    primary:
      provider: openai
      model: "gpt-4o"
    fallback:
      - provider: gemini
        model: "gemini-1.5-pro"

  nabu-minimax:
    primary:
      provider: dahl
      model: "MiniMaxAI/MiniMax-M2.7"
    fallback:
      - provider: groq
        model: "llama-3.1-70b-versatile"

  nabu-kimi:
    primary:
      provider: dahl
      model: "moonshotai/Kimi-K2.6"
    fallback:
      - provider: openai
        model: "gpt-4o"

  nabu-local:
    primary:
      provider: ollama
      model: "llama3.1"

  nabu-parspack:
    primary:
      provider: parspack
      model: "openai/gpt-5.5"
      param_style: reasoning
    fallback:
      - provider: parspack
        model: "openai/gpt-4o-2024-11-20"
      - provider: parspack
        model: "deepseek/deepseek-v4-pro"
      - provider: parspack
        model: "z-ai/glm-5.2"


  nabu-avalai:
    primary:
      provider: avalai
      model: "gpt-5.5"
    fallback:
      - provider: avalai
        model: "gemini-2.5-flash"

  nabu-gap:
    primary:
      provider: gapgpt
      model: "gpt-5.6-luna"
    fallback:
      - provider: gapgpt
        model: "claude-sonnet-5"

  nabu-arvan:
    primary:
      provider: arvan
      model: "DeepSeek-R1-qwen-7b-awq"

  # Cloudflare Workers AI-backed chat alias (or call the passthrough directly:
  # "cloudflare/@cf/<author>/<model>").
  nabu-cloudflare:
    primary:
      provider: cloudflare
      model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
    fallback:
      - provider: cloudflare
        model: "@cf/meta/llama-3.1-8b-instruct"

  # TokenRouter-backed chat alias using its smart "auto:balance" routing (or call
  # "tokenrouter/<model>" directly via passthrough, e.g. "tokenrouter/glm-5.2").
  nabu-tokenrouter:
    primary:
      provider: tokenrouter
      model: "auto:balance"
    fallback:
      - provider: tokenrouter
        model: "gpt-4o"

images:
  nabu-image:
    primary:
      provider: openai
      model: "gpt-image-1"
    fallback:
      - provider: gemini
        model: "gemini-2.5-flash-image"
      - provider: pexels
        model: "search"

  # Stock photos only: search Pexels for the prompt (empty prompt → curated).
  nabu-photo:
    primary:
      provider: pexels
      model: "search"

audio:
  nabu-voice:
    primary:
      provider: openai
      model: "gpt-4o-mini-tts"
    fallback:
      - provider: gemini
        model: "gemini-2.5-flash-preview-tts"

  # 9Router-backed alias. 9Router runs its own 3-tier fallback internally, so a
  # single target is usually enough; the model id must match something its
  # dashboard actually exposes for a connected provider.
  nabu-9router:
    primary:
      provider: 9router
      model: "anthropic/claude-3-5-sonnet-20241022"

embeddings:
  # General-purpose embedding alias. The fallback chain deliberately crosses
  # vector widths (1536 → 768 → 1024): fine for search performed at query time,
  # wrong for anything that stores the vectors — see write-embed below.
  nabu-embed:
    primary:
      provider: openai
      model: "text-embedding-3-small"
    fallback:
      - provider: gemini
        model: "text-embedding-004"
      - provider: cloudflare
        model: "@cf/baai/bge-large-en-v1.5"

  # NabuWrite's Style RAG index.
  #
  # No fallback, deliberately. NabuWrite stores these vectors in a fixed-width
  # pgvector column. A fallback of a different width would either fail the
  # insert or — worse — split the corpus across two incompatible embedding
  # spaces with no error at all. A failed embed is a retryable error; a
  # wrong-width vector is a corrupt index.
  #
  # Routed through Parspack because it is the provider actually keyed on this
  # deployment, and text-embedding-3-small is natively 1536-wide, so the
  # client's requested `dimensions` and the model's default agree.
  write-embed:
    primary:
      provider: parspack
      model: "openai/text-embedding-3-small"

# Sub-agents (system prompt + defaults over an alias, addressable as a "model").
# The Cinematic Scrollytelling squad ships as one YAML file per agent under
# /app/agents in the image (./agents in the repo). Add your own inline under an
# `agents:` map or as more files in this directory. Grant with allow: ["cine-*"].
agents_dir: "/app/agents"

pricing:
  "openai/gpt-4o": { input: 2.5, output: 10 }
  "openai/gpt-4o-mini": { input: 0.15, output: 0.6 }
  "openai/text-embedding-3-small": { input: 0.02, output: 0 }
  "anthropic/claude-3-5-sonnet-latest": { input: 3, output: 15 }
  "anthropic/claude-3-5-haiku-latest": { input: 0.8, output: 4 }
  "gemini/gemini-1.5-pro": { input: 1.25, output: 5 }
  "groq/llama-3.1-70b-versatile": { input: 0.59, output: 0.79 }
