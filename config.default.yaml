# NabuGate — default config baked into the Docker image (/app/config.yaml).
#
# This file contains no secrets. Gateway and provider keys are injected through
# environment variables at runtime. Providers without an available key are
# skipped automatically.

server:
  port: 8080
  api_keys:
    - "${NABU_API_KEY}"
  keys:
    # NabuWrite. One glob covers its three write-* agents and the write-embed
    # alias, so the project key cannot reach any other model on the gateway.
    # Skipped automatically when NABUWRITE_KEY is unset.
    - key: "${NABUWRITE_KEY}"
      project: "nabuwrite"
      allow: ["write-*"]
      rate_limit: 120

    # Dadebaran (dadebaran.ir) presents the gateway catalogue as its model
    # picker, so its allow-list is what its users can choose from. It is broad
    # on purpose — but it is a project key, not the admin key: usage is
    # attributed to "dadebaran" in /v1/usage and a leak cannot administer the
    # gateway. Skipped automatically when DADEBARAN_KEY is unset.
    # NabuSu. Deliberately the narrowest key here: only its own agent, which
    # carries the night-companion safety limits. This is a health-adjacent app
    # and a broader glob would let a tampered client reach a plain alias with no
    # limits attached.
    - key: "${NABUSU_KEY}"
      project: "nabusu"
      allow: ["nabusu-night-companion"]
      rate_limit: 120

    # NabuVoice. Voice turns are short and frequent, hence the higher ceiling.
    - key: "${NABUVOICE_KEY}"
      project: "nabuvoice"
      allow: ["nabu-*"]
      rate_limit: 300

    # NabuDesk. desk-* covers its width-stable embedding alias.
    - key: "${NABUDESK_KEY}"
      project: "nabudesk"
      allow: ["nabu-*", "desk-*"]
      rate_limit: 240

    # NabuGen. Its chat goes through app/core/ai_gateway.py, which prefers
    # NABUGATE_API_KEY over the legacy OPENAI_* variables.
    - key: "${NABUGEN_KEY}"
      project: "nabugen"
      allow: ["nabu-*", "gen-*", "openrouter/*"]
      rate_limit: 240

    # NabuChat. chat-* covers its no-fallback embedding alias.
    - key: "${NABUCHAT_KEY}"
      project: "nabuchat"
      allow: ["nabu-*", "chat-*"]
      rate_limit: 240

    # Zooey. zooey-* covers zooey-embed, the 768-wide alias its Qdrant
    # collection is pinned to. No passthrough glob: Zooey names portable
    # aliases only, so a pinned provider coordinate would be a bug on its side,
    # not something to permit here.
    #
    # Higher ceiling than the other CRMs because a single inbound lead message
    # can fan out to several calls — qualification, scoring, and a reply.
    - key: "${ZOOEY_KEY}"
      project: "zooey"
      allow: ["nabu-*", "zooey-*"]
      rate_limit: 300

    # ClaudeBridge. Its assistant runs a bounded tool loop against a WordPress
    # site, so a single question can turn into several completions — hence the
    # ceiling sits with the CRMs rather than the one-shot writers.
    #
    # Chat aliases only. It embeds nothing and stores no vectors, so an
    # embedding alias here would be scope it cannot use. Skipped automatically
    # when CLAUDEBRIDGE_KEY is unset.
    - key: "${CLAUDEBRIDGE_KEY}"
      project: "claudebridge"
      allow: ["nabu-*"]
      rate_limit: 300

    - key: "${DADEBARAN_KEY}"
      project: "dadebaran"
      allow: ["nabu-*", "parspack/*", "avalai/*", "gapgpt/*", "gpt-*", "o1", "o3", "o3-mini", "o4-mini", "deepseek-*", "kimi-*", "minimax-*", "glm-*"]
      rate_limit: 240

providers:
  openai:
    enabled: true
    type: openai
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"

  groq:
    enabled: true
    type: openai
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"

  openrouter:
    enabled: true
    type: openai
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"

  # Cloudflare Workers AI (developers.cloudflare.com/workers-ai) — OpenAI-wire
  # serverless inference (Llama / gpt-oss / Qwen / Mistral / DeepSeek / bge). The
  # account id is templated into base_url; auth is a Bearer token. Both
  # CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_KEY are required — skipped when the
  # key is unset. passthrough exposes "cloudflare/@cf/<author>/<model>"; Workers
  # AI has no /v1/models, so the static list below is what /v1/models advertises.
  cloudflare:
    enabled: true
    type: openai
    base_url: "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"
    api_key_env: "CLOUDFLARE_API_KEY"
    passthrough: true
    models:
      - "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      - "@cf/meta/llama-3.1-8b-instruct"
      - "@cf/openai/gpt-oss-120b"
      - "@cf/baai/bge-large-en-v1.5"

  # TokenRouter (api.tokenrouter.io) — OpenAI-wire router fronting 300+ models
  # (OpenAI / Claude / Gemini / Llama / DeepSeek / GLM …) with "auto:*" routing.
  # passthrough exposes "tokenrouter/<model>" (e.g. tokenrouter/glm-5.2,
  # tokenrouter/auto:balance); its /v1/models feeds live discovery. Skipped when
  # TOKENROUTER_API_KEY is unset.
  tokenrouter:
    enabled: true
    type: openai
    base_url: "https://api.tokenrouter.io/v1"
    api_key_env: "TOKENROUTER_API_KEY"
    passthrough: true

  dahl:
    enabled: true
    type: openai
    base_url: "https://inference.dahl.global/v1"
    api_key_env: "DAHL_API_KEY"

  parspack:
    enabled: true
    type: openai
    base_url: "https://my.parspack.com/api/aistudio/api/v1"
    api_key_env: "PARSPACK_API_KEY"
    # Parspack AI Studio is not a single model — it is a provider hosting many.
    # passthrough lets callers address any of them directly as
    # "parspack/<model>" (e.g. "parspack/openai/gpt-5.5") with no per-model
    # alias, and surfaces its whole catalogue on /v1/models via live discovery
    # of the provider's own /v1/models endpoint. Grant access with
    # allow: ["parspack/*"] on a project key.
    passthrough: true

  # AvalAI (avalai.ir) — OpenAI-wire aggregator (GPT / Claude / Gemini / Qwen /
  # Llama / Mistral / Grok / DeepSeek / …) with rial billing. Fully OpenAI
  # compatible, so passthrough discovery surfaces its catalogue as "avalai/*".
  # Skipped automatically when AVALAI_API_KEY is unset.
  avalai:
    enabled: true
    type: openai
    base_url: "https://api.avalai.ir/v1"
    api_key_env: "AVALAI_API_KEY"
    passthrough: true

  # GapGPT (gapgpt.app) — OpenAI-wire aggregator, rial billing. passthrough
  # exposes its catalogue as "gapgpt/*"; the static models are a curated
  # fallback for /v1/models. Skipped when GAPGPT_API_KEY is unset.
  gapgpt:
    enabled: true
    type: openai
    base_url: "https://api.gapgpt.app/v1"
    api_key_env: "GAPGPT_API_KEY"
    passthrough: true
    models:
      - "gpt-5.6-sol"
      - "gpt-5.6-luna"
      - "claude-sonnet-5"
      - "gemini-3.1-pro-preview"
      - "deepseek-v4-pro"

  # ArvanCloud AIaaS (arvancloud.ir) — private per-model endpoint on Iranian
  # infra. OpenAI-wire chat body, but auth is "apikey <key>" not "Bearer", hence
  # auth_scheme. Set ARVAN_AIAAS_ENDPOINT to your endpoint URL and ARVAN_API_KEY
  # to its access key; skipped when either is unset. Not passthrough (one model).
  arvan:
    enabled: true
    type: openai
    base_url: "${ARVAN_AIAAS_ENDPOINT}"
    api_key_env: "ARVAN_API_KEY"
    auth_scheme: "apikey"

  # ── Providers with a permanent free tier ────────────────────────────────
  # All OpenAI-wire, so no adapter code is needed. Each is skipped
  # automatically while its key env is empty, so listing them costs nothing
  # until you actually sign up.
  #
  # passthrough is set on the multi-model ones: their catalogue is discovered
  # live from the provider's own /v1/models, so a new model they add becomes
  # addressable as "<provider>/<model>" without touching this file.
  #
  # Quotas below were the published figures in mid-2026 and providers change
  # them often — treat them as orientation, not contract.

  # A second OpenRouter account. Two accounts are two independent quota pools,
  # which is the property a fallback actually needs — the same key twice is one
  # target wearing two hats. Skipped while OPENROUTER_API_KEY_2 is unset.
  openrouter2:
    enabled: true
    type: openai
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY_2"
    passthrough: true

  # Cerebras — ~1M tokens/day free, no card. Fastest inference of the group.
  cerebras:
    enabled: true
    type: openai
    base_url: "https://api.cerebras.ai/v1"
    api_key_env: "CEREBRAS_API_KEY"
    passthrough: true

  # Mistral — Experiment tier is ~1B tokens/month, the most generous permanent
  # free quota here, but it requires opting into training on your data. Do not
  # route anything confidential through it.
  mistral:
    enabled: true
    type: openai
    base_url: "https://api.mistral.ai/v1"
    api_key_env: "MISTRAL_API_KEY"
    passthrough: true

  # NVIDIA NIM — 100+ hosted models (Llama, Mistral, Nemotron, DeepSeek, Qwen,
  # Phi, Gemma, Granite) free on one endpoint.
  nvidia:
    enabled: true
    type: openai
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key_env: "NVIDIA_API_KEY"
    passthrough: true

  # GitHub Models — free access to GPT-4o, Claude and Llama for GitHub
  # accounts, through an Azure-hosted OpenAI-wire endpoint. Auth is a GitHub
  # PAT, not a vendor key.
  github:
    enabled: true
    type: openai
    base_url: "https://models.inference.ai.azure.com"
    api_key_env: "GITHUB_MODELS_TOKEN"
    passthrough: true

  # SiliconFlow — a set of permanently free open-weight models alongside paid
  # ones.
  siliconflow:
    enabled: true
    type: openai
    base_url: "https://api.siliconflow.cn/v1"
    api_key_env: "SILICONFLOW_API_KEY"
    passthrough: true

  # Together AI — free credits plus a few permanently free model endpoints.
  together:
    enabled: true
    type: openai
    base_url: "https://api.together.xyz/v1"
    api_key_env: "TOGETHER_API_KEY"
    passthrough: true

  # Cohere — free developer tier; note the OpenAI-compatible surface lives
  # under /compatibility/v1, not /v1.
  cohere:
    enabled: true
    type: openai
    base_url: "https://api.cohere.ai/compatibility/v1"
    api_key_env: "COHERE_API_KEY"
    passthrough: true

  # 9Router — an OpenAI-compatible smart router you SELF-HOST, fronting 60+
  # providers (Claude Code, Codex, Gemini, GLM, MiniMax, Kimi, Qwen, …) with its
  # own 3-tier fallback. It is software, not a SaaS, which is why NabuGate's
  # compose bundles it as a `ninerouter` service rather than just naming a URL.
  #
  # Two separate steps, and only the first is automated:
  #   1. run it            — the compose service does this
  #   2. connect providers — a ONE-TIME manual step in its dashboard, which
  #                          holds OAuth tokens and API keys. Until that is
  #                          done every model answers "No active credentials".
  #
  # base_url comes from env because "localhost" is wrong once NabuGate runs in a
  # container: inside the distroless image localhost is the gateway itself.
  #   • bundled service:            http://ninerouter:20128/v1
  #   • same host, no container:    http://localhost:20128/v1
  #   • gateway in Docker on host:  http://host.docker.internal:20128/v1
  # Unset → provider auto-skipped, so the gateway still boots without it.
  #
  # Keyless: the local endpoint ignores the adapter's placeholder bearer.
  # Multi-model + OpenAI-wire ⇒ passthrough, addressable as "9router/<model>"
  # with its catalogue discovered live from /v1/models.
  9router:
    enabled: true
    type: openai
    base_url: "${NINEROUTER_BASE_URL}"
    passthrough: true

  anthropic:
    enabled: true
    type: anthropic
    base_url: "https://api.anthropic.com/v1"
    api_key_env: "ANTHROPIC_API_KEY"

  gemini:
    enabled: true
    type: gemini
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    api_key_env: "GEMINI_API_KEY"

  # Pexels stock photos as an image source. An image alias pointed here searches
  # Pexels for the prompt and returns real photos. Skipped when PEXELS_API_KEY
  # is unset, like any other keyed provider.
  pexels:
    enabled: true
    type: pexels
    base_url: "https://api.pexels.com/v1"
    api_key_env: "PEXELS_API_KEY"

  # mrc_imagegen — branded graphics, not a diffusion model.
  #
  # It renders a fixed canvas from a kicker, two headline lines, a theme and a
  # palette: the same card, story and header layouts the studio produces. A
  # prompt here is copy to be laid out, not a scene to imagine — ask it for "a
  # cat on a roof" and you get those words set in the brand's typeface. That is
  # why its aliases are separate from nabu-image rather than a fallback for it.
  #
  # Send JSON in the prompt for exact control of the fields; plain text is split
  # across the two headline lines. Skipped while MRC_IMAGEGEN_KEY is unset.
  imagegen:
    enabled: true
    type: imagegen
    base_url: "${MRC_IMAGEGEN_URL}"
    api_key_env: "MRC_IMAGEGEN_KEY"

  ollama:
    enabled: true
    type: openai
    base_url: "${OLLAMA_BASE_URL}"

# Model registry — a model is an identity, not a provider coordinate.
#
# "gpt-5.5" is the same model whether Parspack, AvalAI or GapGPT serves it, and
# each spells the upstream name differently. Declaring it once here means an
# alias can name the model alone: the router expands it into one attempt per
# serving provider, in this order, skipping any provider without a live key.
#
# The effect is that a provider going down switches to the next one serving the
# same model, silently — the caller asked for a model and gets that model.
#
# param_style belongs to the model, so it is declared once and inherited by
# every provider serving it.
model_registry:
  gpt-5.5:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-5.5"
      - provider: avalai
        model: "gpt-5.5"
      - provider: gapgpt
        model: "gpt-5.5"
      - provider: openai
        model: "gpt-5.5"

  gpt-4o-mini:
    serves:
      - provider: parspack
        model: "openai/gpt-4o-mini"
      - provider: avalai
        model: "gpt-4o-mini"
      - provider: gapgpt
        model: "gpt-4o-mini"
      - provider: openai
        model: "gpt-4o-mini"

  gpt-4o:
    serves:
      - provider: parspack
        model: "openai/gpt-4o-2024-11-20"
      - provider: avalai
        model: "gpt-4o"
      - provider: openai
        model: "gpt-4o"

  gpt-4.1-mini:
    serves:
      - provider: parspack
        model: "openai/gpt-4.1-mini"
      - provider: avalai
        model: "gpt-4.1-mini"

  gpt-4.1-nano:
    serves:
      - provider: parspack
        model: "openai/gpt-4.1-nano"

  deepseek-v4-pro:
    serves:
      - provider: parspack
        model: "deepseek/deepseek-v4-pro"
      - provider: gapgpt
        model: "deepseek-v4-pro"

  # Leaks its chain of thought into `content` on Parspack; keep it out of
  # user-facing aliases.
  kimi-k2.6:
    serves:
      - provider: dahl
        model: "moonshotai/Kimi-K2.6"
      - provider: parspack
        model: "moonshotai/kimi-k2.6"

  # Leaks its chain of thought into `content` on Parspack, intermittently.
  # Keep it out of the lead position on user-facing aliases.
  minimax-m2.7:
    serves:
      - provider: dahl
        model: "MiniMaxAI/MiniMax-M2.7"
      - provider: parspack
        model: "minimax/minimax-m2.7"

  glm-5.2:
    serves:
      - provider: parspack
        model: "z-ai/glm-5.2"
      - provider: tokenrouter
        model: "glm-5.2"

  gpt-oss-20b:
    serves:
      - provider: parspack
        model: "openai/gpt-oss-20b"
      # Free floor: reaching here costs nothing rather than returning an error.
      - model: ling-3.0-flash
      - model: nemotron-3-ultra
      - provider: cloudflare
        model: "@cf/openai/gpt-oss-120b"


  # The remaining reasoning-dialect models found by probing the catalogue. They
  # are listed so their dialect is declared: a client that sends max_tokens —
  # which most do — otherwise gets an HTML 502 from the provider and no useful
  # error. The dialect is not guessable from the name, which is why every one of
  # these was verified by probe, including both search-preview models.
  gpt-5:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-5"
      - provider: avalai
        model: "gpt-5"

  gpt-5-mini:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-5-mini"

  gpt-5.3-chat:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-5.3-chat"

  o1:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/o1"
      - provider: avalai
        model: "o1"

  o3:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/o3"
      - provider: avalai
        model: "o3"

  o3-mini:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/o3-mini"

  o4-mini:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/o4-mini"

  gpt-4o-search-preview:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-4o-search-preview"

  gpt-4o-mini-search-preview:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-4o-mini-search-preview"

  # OpenRouter free tier — verified answering on the harvested key. These cost
  # nothing, so they belong at the end of chains as a floor rather than a
  # failure.
  ling-3.0-flash:
    serves:
      - provider: openrouter
        model: "inclusionai/ling-3.0-flash:free"
      - provider: openrouter2
        model: "inclusionai/ling-3.0-flash:free"

  nemotron-3-ultra:
    serves:
      - provider: openrouter
        model: "nvidia/nemotron-3-ultra-550b-a55b:free"
      - provider: openrouter2
        model: "nvidia/nemotron-3-ultra-550b-a55b:free"
      - provider: parspack
        model: "nvidia/nemotron-3-ultra-preview"

  laguna-m:
    serves:
      - provider: openrouter
        model: "poolside/laguna-m.1:free"
      - provider: openrouter2
        model: "poolside/laguna-m.1:free"
      - provider: parspack
        model: "poolside/laguna-m.1"


models:
  nabu-fast:
    # minimax-m2.7 is deliberately not the primary. Like kimi-k2.6 it leaks its
    # reasoning into `content` on Parspack — intermittently, which is worse than
    # always: the same prompt returns "Hi!" once and "The user asks: ..." the
    # next time, so it looks like a flaky model rather than a broken one.
    # It stays reachable as nabu-minimax.
    primary:
      model: gpt-4o-mini
    fallback:
      - model: gpt-4.1-mini
      - model: minimax-m2.7


  nabu-smart:
    # kimi-k2.6 is deliberately NOT here. On Parspack it returns its reasoning
    # inline as `content` — no separate reasoning field and no delimiter to strip
    # — so a caller gets "The user says ... the persona is ..." instead of an
    # answer. It stays reachable as nabu-kimi for anyone who wants it knowingly.
    primary:
      model: gpt-5.5
    fallback:
      - model: gpt-4o
      - model: deepseek-v4-pro
      - model: gpt-4.1-mini


  nabu-cheap:
    primary:
      model: gpt-4.1-nano
    fallback:
      - model: gpt-4o-mini
      - model: gpt-oss-20b


  # Both rungs of the previous chain were dead, so the alias returned 502 for
  # every request — including plain text:
  #   - `openai/gpt-4o` was a PINNED coordinate and OPENAI_API_KEY is empty, so
  #     the router skipped it ("provider unavailable") instead of reaching the
  #     same model on a provider that is keyed.
  #   - `gemini-1.5-pro` has been retired; Google answers 404 for it.
  #
  # Naming `gpt-4o` through the registry is the fix for the first: the router
  # expands it across every provider serving that model and skips the unkeyed
  # ones, which is how nabu-smart survives the same empty OPENAI_API_KEY.
  #
  # The Gemini rung is checked against ListModels rather than assumed — that is
  # what made the old one rot silently.
  nabu-vision:
    primary:
      model: gpt-4o
    fallback:
      - provider: gemini
        model: "gemini-2.5-flash"

  nabu-minimax:
    primary:
      provider: dahl
      model: "MiniMaxAI/MiniMax-M2.7"
    fallback:
      - provider: groq
        model: "llama-3.1-70b-versatile"

  nabu-kimi:
    primary:
      provider: dahl
      model: "moonshotai/Kimi-K2.6"
    fallback:
      - provider: openai
        model: "gpt-4o"

  nabu-local:
    primary:
      provider: ollama
      model: "llama3.1"

  nabu-parspack:
    primary:
      provider: parspack
      model: "openai/gpt-5.5"
      param_style: reasoning
    fallback:
      - provider: parspack
        model: "openai/gpt-4o-2024-11-20"
      - provider: parspack
        model: "deepseek/deepseek-v4-pro"
      - provider: parspack
        model: "z-ai/glm-5.2"


  nabu-avalai:
    primary:
      provider: avalai
      model: "gpt-5.5"
    fallback:
      - provider: avalai
        model: "gemini-2.5-flash"

  nabu-gap:
    primary:
      provider: gapgpt
      model: "gpt-5.6-luna"
    fallback:
      - provider: gapgpt
        model: "claude-sonnet-5"

  nabu-arvan:
    primary:
      provider: arvan
      model: "DeepSeek-R1-qwen-7b-awq"

  # Cloudflare Workers AI-backed chat alias (or call the passthrough directly:
  # "cloudflare/@cf/<author>/<model>").
  nabu-cloudflare:
    primary:
      provider: cloudflare
      model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
    fallback:
      - provider: cloudflare
        model: "@cf/meta/llama-3.1-8b-instruct"

  # TokenRouter-backed chat alias using its smart "auto:balance" routing (or call
  # "tokenrouter/<model>" directly via passthrough, e.g. "tokenrouter/glm-5.2").
  nabu-tokenrouter:
    primary:
      provider: tokenrouter
      model: "auto:balance"
    fallback:
      - provider: tokenrouter
        model: "gpt-4o"

images:
  nabu-image:
    primary:
      provider: openai
      model: "gpt-image-1"
    fallback:
      - provider: gemini
        model: "gemini-2.5-flash-image"
      - provider: pexels
        model: "search"

  # Stock photos only: search Pexels for the prompt (empty prompt → curated).
  nabu-photo:
    primary:
      provider: pexels
      model: "search"

  # Branded graphics from mrc_imagegen. Three aliases rather than one because
  # the canvas is chosen by the model name, and these are three different
  # shapes: 1600x900 for an article header, 1080x1350 for a feed card,
  # 1080x1920 for a story.
  #
  # No fallback on any of them. A diffusion model standing in for these would
  # return something that is not the brand — wrong typeface, wrong palette, no
  # logo — and a caller asking for a branded header would rather get an error
  # than a plausible-looking stranger's design.
  nabu-header:
    primary:
      provider: imagegen
      model: "header"

  nabu-card:
    primary:
      provider: imagegen
      model: "card"

  nabu-story:
    primary:
      provider: imagegen
      model: "story"

audio:
  nabu-voice:
    primary:
      provider: openai
      model: "gpt-4o-mini-tts"
    fallback:
      - provider: gemini
        model: "gemini-2.5-flash-preview-tts"

  # 9Router-backed alias. 9Router runs its own 3-tier fallback internally, so a
  # single target is usually enough; the model id must match something its
  # dashboard actually exposes for a connected provider.
  nabu-9router:
    primary:
      provider: 9router
      model: "anthropic/claude-3-5-sonnet-20241022"

embeddings:
  # General-purpose embedding alias. The fallback chain deliberately crosses
  # vector widths (1536 → 768 → 1024): fine for search performed at query time,
  # wrong for anything that stores the vectors — see write-embed below.
  nabu-embed:
    primary:
      provider: openai
      model: "text-embedding-3-small"
    fallback:
      - provider: gemini
        model: "text-embedding-004"
      - provider: cloudflare
        model: "@cf/baai/bge-large-en-v1.5"

  # NabuDesk's knowledge + conversation index, 1536 wide.
  #
  # Its EmbeddingService checks the returned width and logs a mismatch, which is
  # better than most callers manage — but a warning does not stop the insert, so
  # the alias still must not change width. Same-width fallback only.
  desk-embed:
    primary:
      provider: parspack
      model: "openai/text-embedding-3-small"
    fallback:
      - provider: gemini
        model: "gemini-embedding-001"

  # NabuGen's content memory — 1024 wide, matching the column its schema
  # already declares, so enabling the feature needs no re-index.
  #
  # gemini-embedding-001 emits any requested width, so the CALLER MUST SEND
  # `dimensions: 1024`. Without it the provider returns 3072 and the insert
  # fails. NabuGen currently has this feature disabled (no embedding key), so
  # this alias is ready rather than in use.
  gen-embed:
    primary:
      provider: gemini
      model: "gemini-embedding-001"

  # NabuChat's Qdrant index.
  #
  # No fallback, for the same reason as write-embed below: its Qdrant collection
  # is created at 1536 and a fallback of another width would corrupt it rather
  # than fail loudly. NabuChat's own code notes the 1536 constraint and then
  # defaults to nabu-embed, which does cross widths — hence this alias.
  chat-embed:
    primary:
      provider: parspack
      model: "openai/text-embedding-3-small"
    fallback:
      # Same width, which is the whole point. The no-fallback rule existed to
      # stop a fallback CHANGING the vector width, not to forbid fallback: a
      # rung that is also 1536 is strictly better than none. gemini-embedding-001
      # defaults to 3072, so this is only safe because the gateway forwards the
      # client's `dimensions` and NabuWrite/NabuChat both send 1536 — verified
      # against this key returning exactly 1536.
      - provider: gemini
        model: "gemini-embedding-001"

  # Zooey's semantic-memory index — 768 wide.
  #
  # Its Qdrant collection is declared at `"size": 768`, inherited from the
  # Google text-embedding-004 the code called directly before moving onto the
  # gateway. text-embedding-004 is NOT the model here: it no longer supports
  # embedContent on this key and answers 404, the same way gemini-1.5-pro rotted
  # out of nabu-vision. Probed against ListModels filtered by embedContent —
  # filtering by generateContent, which is the obvious mistake, lists models
  # that cannot embed at all.
  #
  # Switching models is safe only because nothing has been indexed yet: Zooey's
  # QDRANT_URL points at a host that does not exist in its stack, so the feature
  # has never run in production and there is no corpus to split. Once it does
  # run, this model is fixed — a different one writes into a different semantic
  # space at the same width, which no error would reveal.
  #
  # No fallback, deliberately — and note this is the one place the
  # cross-vendor-fallback rule does NOT apply.
  #
  # That rule is about availability: two models behind one key share an outage,
  # so a chat alias must end on a different vendor. For a STORED index the
  # binding constraint is different and stricter. Zooey's existing vectors were
  # produced by text-embedding-004. Any other model writes into a different
  # semantic space, so a fallback would keep the width valid while quietly
  # making half the corpus unsearchable against the other half — no failed
  # insert, no error, just retrieval that slowly stops working.
  #
  # Matching the width is necessary and not sufficient: same width, different
  # model is still a split corpus. write-embed reaches the same conclusion.
  #
  # A failed embed is a retryable error. A wrong-model vector is a corrupt index
  # that nothing detects.
  #
  # Zooey still sends `dimensions: 768` on every request and verifies the
  # returned length before inserting, as a second line of defence.
  # gemini-embedding-001 emits whatever width is asked for and defaults to 3072,
  # so this is only 768 because Zooey sends `dimensions: 768` on every request
  # and refuses any response of another length before storing it.
  zooey-embed:
    primary:
      provider: gemini
      model: "gemini-embedding-001"

  # NabuWrite's Style RAG index.
  #
  # No fallback, deliberately. NabuWrite stores these vectors in a fixed-width
  # pgvector column. A fallback of a different width would either fail the
  # insert or — worse — split the corpus across two incompatible embedding
  # spaces with no error at all. A failed embed is a retryable error; a
  # wrong-width vector is a corrupt index.
  #
  # Routed through Parspack because it is the provider actually keyed on this
  # deployment, and text-embedding-3-small is natively 1536-wide, so the
  # client's requested `dimensions` and the model's default agree.
  write-embed:
    primary:
      provider: parspack
      model: "openai/text-embedding-3-small"
    fallback:
      # Same-width rung; see chat-embed above for why this is safe.
      - provider: gemini
        model: "gemini-embedding-001"

# Sub-agents (system prompt + defaults over an alias, addressable as a "model").
# The Cinematic Scrollytelling squad ships as one YAML file per agent under
# /app/agents in the image (./agents in the repo). Add your own inline under an
# `agents:` map or as more files in this directory. Grant with allow: ["cine-*"].
agents_dir: "/app/agents"

pricing:
  "openai/gpt-4o": { input: 2.5, output: 10 }
  "openai/gpt-4o-mini": { input: 0.15, output: 0.6 }
  "openai/text-embedding-3-small": { input: 0.02, output: 0 }
  "anthropic/claude-3-5-sonnet-latest": { input: 3, output: 15 }
  "anthropic/claude-3-5-haiku-latest": { input: 0.8, output: 4 }
  "gemini/gemini-1.5-pro": { input: 1.25, output: 5 }
  "groq/llama-3.1-70b-versatile": { input: 0.59, output: 0.79 }
