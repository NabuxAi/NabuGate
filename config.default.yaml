# NabuGate — default config baked into the Docker image (/app/config.yaml).
#
# This file contains no secrets. Gateway and provider keys are injected through
# environment variables at runtime. Providers without an available key are
# skipped automatically.

server:
  port: 8080
  api_keys:
    - "${NABU_API_KEY}"
  keys:
    # NabuWrite. One glob covers its three write-* agents and the write-embed
    # alias, so the project key cannot reach any other model on the gateway.
    # Skipped automatically when NABUWRITE_KEY is unset.
    - key: "${NABUWRITE_KEY}"
      project: "nabuwrite"
      allow: ["write-*"]
      rate_limit: 120

    # Dadebaran (dadebaran.ir) presents the gateway catalogue as its model
    # picker, so its allow-list is what its users can choose from. It is broad
    # on purpose — but it is a project key, not the admin key: usage is
    # attributed to "dadebaran" in /v1/usage and a leak cannot administer the
    # gateway. Skipped automatically when DADEBARAN_KEY is unset.
    # NabuSu. Deliberately the narrowest key here: only its own agent, which
    # carries the night-companion safety limits. This is a health-adjacent app
    # and a broader glob would let a tampered client reach a plain alias with no
    # limits attached.
    - key: "${NABUSU_KEY}"
      project: "nabusu"
      allow: ["nabusu-night-companion"]
      rate_limit: 120

    # NabuVoice. Voice turns are short and frequent, hence the higher ceiling.
    - key: "${NABUVOICE_KEY}"
      project: "nabuvoice"
      allow: ["nabu-*"]
      rate_limit: 300

    # NabuDesk. desk-* covers its width-stable embedding alias.
    - key: "${NABUDESK_KEY}"
      project: "nabudesk"
      allow: ["nabu-*", "desk-*"]
      rate_limit: 240

    # NabuGen. Its chat goes through app/core/ai_gateway.py, which prefers
    # NABUGATE_API_KEY over the legacy OPENAI_* variables.
    - key: "${NABUGEN_KEY}"
      project: "nabugen"
      allow: ["nabu-*", "gen-*", "openrouter/*"]
      rate_limit: 240

    # NabuChat. chat-* covers its no-fallback embedding alias.
    - key: "${NABUCHAT_KEY}"
      project: "nabuchat"
      allow: ["nabu-*", "chat-*"]
      rate_limit: 240

    # Zooey. zooey-* covers zooey-embed, the 768-wide alias its Qdrant
    # collection is pinned to. No passthrough glob: Zooey names portable
    # aliases only, so a pinned provider coordinate would be a bug on its side,
    # not something to permit here.
    #
    # Higher ceiling than the other CRMs because a single inbound lead message
    # can fan out to several calls — qualification, scoring, and a reply.
    - key: "${ZOOEY_KEY}"
      project: "zooey"
      allow: ["nabu-*", "zooey-*"]
      rate_limit: 300

    # ClaudeBridge. Its assistant runs a bounded tool loop against a WordPress
    # site, so a single question can turn into several completions — hence the
    # ceiling sits with the CRMs rather than the one-shot writers.
    #
    # Chat aliases only. It embeds nothing and stores no vectors, so an
    # embedding alias here would be scope it cannot use. Skipped automatically
    # when CLAUDEBRIDGE_KEY is unset.
    - key: "${CLAUDEBRIDGE_KEY}"
      project: "claudebridge"
      allow: ["nabu-*"]
      rate_limit: 300

    - key: "${DADEBARAN_KEY}"
      project: "dadebaran"
      allow: ["nabu-*", "parspack/*", "avalai/*", "gapgpt/*", "gpt-*", "o1", "o3", "o3-mini", "o4-mini", "deepseek-*", "kimi-*", "minimax-*", "glm-*"]
      rate_limit: 240

providers:
  openai:
    enabled: true
    type: openai
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"

  groq:
    enabled: true
    type: openai
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"

  openrouter:
    enabled: true
    type: openai
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"

  # Cloudflare Workers AI (developers.cloudflare.com/workers-ai) — OpenAI-wire
  # serverless inference (Llama / gpt-oss / Qwen / Mistral / DeepSeek / bge). The
  # account id is templated into base_url; auth is a Bearer token. Both
  # CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_KEY are required — skipped when the
  # key is unset. passthrough exposes "cloudflare/@cf/<author>/<model>"; Workers
  # AI has no /v1/models, so the static list below is what /v1/models advertises.
  cloudflare:
    enabled: true
    type: openai
    base_url: "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"
    api_key_env: "CLOUDFLARE_API_KEY"
    passthrough: true
    models:
      - "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      - "@cf/meta/llama-3.1-8b-instruct"
      - "@cf/openai/gpt-oss-120b"
      - "@cf/baai/bge-large-en-v1.5"

  # TokenRouter (api.tokenrouter.io) — OpenAI-wire router fronting 300+ models
  # (OpenAI / Claude / Gemini / Llama / DeepSeek / GLM …) with "auto:*" routing.
  # passthrough exposes "tokenrouter/<model>" (e.g. tokenrouter/glm-5.2,
  # tokenrouter/auto:balance); its /v1/models feeds live discovery. Skipped when
  # TOKENROUTER_API_KEY is unset.
  tokenrouter:
    enabled: true
    type: openai
    base_url: "https://api.tokenrouter.io/v1"
    api_key_env: "TOKENROUTER_API_KEY"
    passthrough: true

  dahl:
    enabled: true
    type: openai
    base_url: "https://inference.dahl.global/v1"
    api_key_env: "DAHL_API_KEY"

  parspack:
    enabled: true
    type: openai
    base_url: "https://my.parspack.com/api/aistudio/api/v1"
    api_key_env: "PARSPACK_API_KEY"
    # Parspack AI Studio is not a single model — it is a provider hosting many.
    # passthrough lets callers address any of them directly as
    # "parspack/<model>" (e.g. "parspack/openai/gpt-5.5") with no per-model
    # alias, and surfaces its whole catalogue on /v1/models via live discovery
    # of the provider's own /v1/models endpoint. Grant access with
    # allow: ["parspack/*"] on a project key.
    passthrough: true

  # AvalAI (avalai.ir) — OpenAI-wire aggregator (GPT / Claude / Gemini / Qwen /
  # Llama / Mistral / Grok / DeepSeek / …) with rial billing. Fully OpenAI
  # compatible, so passthrough discovery surfaces its catalogue as "avalai/*".
  # Skipped automatically when AVALAI_API_KEY is unset.
  avalai:
    enabled: true
    type: openai
    base_url: "https://api.avalai.ir/v1"
    api_key_env: "AVALAI_API_KEY"
    passthrough: true

  # GapGPT (gapgpt.app) — OpenAI-wire aggregator, rial billing. passthrough
  # exposes its catalogue as "gapgpt/*"; the static models are a curated
  # fallback for /v1/models. Skipped when GAPGPT_API_KEY is unset.
  gapgpt:
    enabled: true
    type: openai
    base_url: "https://api.gapgpt.app/v1"
    api_key_env: "GAPGPT_API_KEY"
    passthrough: true
    models:
      - "gpt-5.6-sol"
      - "gpt-5.6-luna"
      - "claude-sonnet-5"
      - "gemini-3.1-pro-preview"
      - "deepseek-v4-pro"

  # ArvanCloud AIaaS (arvancloud.ir) — private per-model endpoint on Iranian
  # infra. OpenAI-wire chat body, but auth is "apikey <key>" not "Bearer", hence
  # auth_scheme. Set ARVAN_AIAAS_ENDPOINT to your endpoint URL and ARVAN_API_KEY
  # to its access key; skipped when either is unset. Not passthrough (one model).
  arvan:
    enabled: true
    type: openai
    base_url: "${ARVAN_AIAAS_ENDPOINT}"
    api_key_env: "ARVAN_API_KEY"
    auth_scheme: "apikey"

  # ── Providers with a permanent free tier ────────────────────────────────
  # All OpenAI-wire, so no adapter code is needed. Each is skipped
  # automatically while its key env is empty, so listing them costs nothing
  # until you actually sign up.
  #
  # passthrough is set on the multi-model ones: their catalogue is discovered
  # live from the provider's own /v1/models, so a new model they add becomes
  # addressable as "<provider>/<model>" without touching this file.
  #
  # Quotas below were the published figures in mid-2026 and providers change
  # them often — treat them as orientation, not contract.

  # A second OpenRouter account. Two accounts are two independent quota pools,
  # which is the property a fallback actually needs — the same key twice is one
  # target wearing two hats. Skipped while OPENROUTER_API_KEY_2 is unset.
  openrouter2:
    enabled: true
    type: openai
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY_2"
    passthrough: true

  # Cerebras — ~1M tokens/day free, no card. Fastest inference of the group.
  cerebras:
    enabled: true
    type: openai
    base_url: "https://api.cerebras.ai/v1"
    api_key_env: "CEREBRAS_API_KEY"
    passthrough: true

  # Mistral — Experiment tier is ~1B tokens/month, the most generous permanent
  # free quota here, but it requires opting into training on your data. Do not
  # route anything confidential through it.
  mistral:
    enabled: true
    type: openai
    base_url: "https://api.mistral.ai/v1"
    api_key_env: "MISTRAL_API_KEY"
    passthrough: true

  # NVIDIA NIM — 100+ hosted models (Llama, Mistral, Nemotron, DeepSeek, Qwen,
  # Phi, Gemma, Granite) free on one endpoint.
  nvidia:
    enabled: true
    type: openai
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key_env: "NVIDIA_API_KEY"
    passthrough: true

  # GitHub Models — free access to GPT-4o, Claude and Llama for GitHub
  # accounts, through an Azure-hosted OpenAI-wire endpoint. Auth is a GitHub
  # PAT, not a vendor key.
  github:
    enabled: true
    type: openai
    base_url: "https://models.inference.ai.azure.com"
    api_key_env: "GITHUB_MODELS_TOKEN"
    passthrough: true

  # SiliconFlow — a set of permanently free open-weight models alongside paid
  # ones.
  siliconflow:
    enabled: true
    type: openai
    base_url: "https://api.siliconflow.cn/v1"
    api_key_env: "SILICONFLOW_API_KEY"
    passthrough: true

  # Together AI — free credits plus a few permanently free model endpoints.
  together:
    enabled: true
    type: openai
    base_url: "https://api.together.xyz/v1"
    api_key_env: "TOGETHER_API_KEY"
    passthrough: true

  # Cohere — free developer tier; note the OpenAI-compatible surface lives
  # under /compatibility/v1, not /v1.
  cohere:
    enabled: true
    type: openai
    base_url: "https://api.cohere.ai/compatibility/v1"
    api_key_env: "COHERE_API_KEY"
    passthrough: true

  # 9Router — an OpenAI-compatible smart router you SELF-HOST, fronting 60+
  # providers (Claude Code, Codex, Gemini, GLM, MiniMax, Kimi, Qwen, …) with its
  # own 3-tier fallback. It is software, not a SaaS, which is why NabuGate's
  # compose bundles it as a `ninerouter` service rather than just naming a URL.
  #
  # Two separate steps, and only the first is automated:
  #   1. run it            — the compose service does this
  #   2. connect providers — a ONE-TIME manual step in its dashboard, which
  #                          holds OAuth tokens and API keys. Until that is
  #                          done every model answers "No active credentials".
  #
  # base_url comes from env because "localhost" is wrong once NabuGate runs in a
  # container: inside the distroless image localhost is the gateway itself.
  #   • bundled service:            http://ninerouter:20128/v1
  #   • same host, no container:    http://localhost:20128/v1
  #   • gateway in Docker on host:  http://host.docker.internal:20128/v1
  # Unset → provider auto-skipped, so the gateway still boots without it.
  #
  # Keyless: the local endpoint ignores the adapter's placeholder bearer.
  # Multi-model + OpenAI-wire ⇒ passthrough, addressable as "9router/<model>"
  # with its catalogue discovered live from /v1/models.
  9router:
    enabled: true
    type: openai
    base_url: "${NINEROUTER_BASE_URL}"
    passthrough: true

  anthropic:
    enabled: true
    type: anthropic
    base_url: "https://api.anthropic.com/v1"
    api_key_env: "ANTHROPIC_API_KEY"

  gemini:
    enabled: true
    type: gemini
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    api_key_env: "GEMINI_API_KEY"

  # Pexels stock photos as an image source. An image alias pointed here searches
  # Pexels for the prompt and returns real photos. Skipped when PEXELS_API_KEY
  # is unset, like any other keyed provider.
  pexels:
    enabled: true
    type: pexels
    base_url: "https://api.pexels.com/v1"
    api_key_env: "PEXELS_API_KEY"

  # mrc_imagegen — branded graphics, not a diffusion model.
  #
  # It renders a fixed canvas from a kicker, two headline lines, a theme and a
  # palette: the same card, story and header layouts the studio produces. A
  # prompt here is copy to be laid out, not a scene to imagine — ask it for "a
  # cat on a roof" and you get those words set in the brand's typeface. That is
  # why its aliases are separate from nabu-image rather than a fallback for it.
  #
  # Send JSON in the prompt for exact control of the fields; plain text is split
  # across the two headline lines. Skipped while MRC_IMAGEGEN_KEY is unset.
  imagegen:
    enabled: true
    type: imagegen
    base_url: "${MRC_IMAGEGEN_URL}"
    api_key_env: "MRC_IMAGEGEN_KEY"

  # gamma.app — decks, documents and social posts, written and designed by
  # Gamma from a prompt.
  #
  # It is reachable as a chat model, not an image one, because what it produces
  # is a multi-card artefact hosted on gamma.app: the answer is a URL (plus an
  # export link when one is asked for), which has nowhere to live in an image
  # response. The API is also asynchronous — create, then poll — and chat is the
  # only shape here that can hold a request open for the minute or two a deck
  # takes.
  #
  # Send JSON in the prompt for exact control (inputText, numCards, themeName,
  # exportAs, …); plain text becomes inputText and the format comes from the
  # alias. Skipped while GAMMA_API_KEY is unset — the key comes from
  # gamma.app → Settings → API access and needs a paid Gamma plan.
  gamma:
    enabled: true
    type: gamma
    base_url: "${GAMMA_BASE_URL}"
    api_key_env: "GAMMA_API_KEY"

  # Self-hosted Whisper (see docker-compose.yml). Keyless, like Ollama: it is
  # enabled purely by having a base_url, and skipped when WHISPER_BASE_URL is
  # blank.
  whisper:
    enabled: true
    type: openai
    base_url: "${WHISPER_BASE_URL}"

  # On-premise OCR. Same shape as whisper above: a local container speaking the
  # OpenAI API, inert until NABUOCR_BASE_URL names it, so an environment without
  # one is unaffected. Tesseract, so it costs CPU rather than money — and its
  # container carries a CPU limit, which the whisper one does not.
  nabuocr:
    enabled: true
    type: openai
    base_url: "${NABUOCR_BASE_URL}"

  ollama:
    enabled: true
    type: openai
    base_url: "${OLLAMA_BASE_URL}"

  # llama.cpp server — ultra-lightweight GGUF inference engine running local
  # models (e.g. Qwen2.5-0.5B / Qwen2.5-1.5B) on CPU. Fully OpenAI-wire compatible.
  # Skipped automatically when LLAMACPP_BASE_URL is unset.
  llamacpp:
    enabled: true
    type: openai
    base_url: "${LLAMACPP_BASE_URL}"
    passthrough: true

# Model registry — a model is an identity, not a provider coordinate.
#
# "gpt-5.5" is the same model whether Parspack, AvalAI or GapGPT serves it, and
# each spells the upstream name differently. Declaring it once here means an
# alias can name the model alone: the router expands it into one attempt per
# serving provider, in this order, skipping any provider without a live key.
#
# The effect is that a provider going down switches to the next one serving the
# same model, silently — the caller asked for a model and gets that model.
#
# param_style belongs to the model, so it is declared once and inherited by
# every provider serving it.
model_registry:
  gpt-5.5:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-5.5"
      - provider: avalai
        model: "gpt-5.5"
      - provider: gapgpt
        model: "gpt-5.5"
      - provider: openai
        model: "gpt-5.5"

  gpt-4o-mini:
    serves:
      - provider: parspack
        model: "openai/gpt-4o-mini"
      - provider: avalai
        model: "gpt-4o-mini"
      - provider: gapgpt
        model: "gpt-4o-mini"
      - provider: openai
        model: "gpt-4o-mini"

  gpt-4o:
    serves:
      - provider: parspack
        model: "openai/gpt-4o-2024-11-20"
      - provider: avalai
        model: "gpt-4o"
      - provider: openai
        model: "gpt-4o"

  gpt-4.1-mini:
    serves:
      - provider: parspack
        model: "openai/gpt-4.1-mini"
      - provider: avalai
        model: "gpt-4.1-mini"

  gpt-4.1-nano:
    serves:
      - provider: parspack
        model: "openai/gpt-4.1-nano"

  deepseek-v4-pro:
    serves:
      - provider: parspack
        model: "deepseek/deepseek-v4-pro"
      - provider: gapgpt
        model: "deepseek-v4-pro"

  # Leaks its chain of thought into `content` on Parspack; keep it out of
  # user-facing aliases.
  kimi-k2.6:
    serves:
      - provider: dahl
        model: "moonshotai/Kimi-K2.6"
      - provider: parspack
        model: "moonshotai/kimi-k2.6"

  # Leaks its chain of thought into `content` on Parspack, intermittently.
  # Keep it out of the lead position on user-facing aliases.
  minimax-m2.7:
    serves:
      - provider: dahl
        model: "MiniMaxAI/MiniMax-M2.7"
      - provider: parspack
        model: "minimax/minimax-m2.7"

  glm-5.2:
    serves:
      - provider: parspack
        model: "z-ai/glm-5.2"
      - provider: tokenrouter
        model: "glm-5.2"

  gpt-oss-20b:
    serves:
      - provider: parspack
        model: "openai/gpt-oss-20b"
      # A `serves` entry is a provider coordinate, not a rung: Serving has only
      # `provider` and `model`, so the two registry references that used to sit
      # here (`- model: ling-3.0-flash`, `- model: nemotron-3-ultra`) named no
      # provider and were skipped. That is why nabu-cheap returned 502 with
      # three Parspack 402s and never reached a free model — the floor existed
      # in the file and not in the router. Cross-registry fallback belongs in a
      # `fallback` list, where `model:` does resolve; see nabu-cheap.
      - provider: cloudflare
        model: "@cf/openai/gpt-oss-120b"


  # The remaining reasoning-dialect models found by probing the catalogue. They
  # are listed so their dialect is declared: a client that sends max_tokens —
  # which most do — otherwise gets an HTML 502 from the provider and no useful
  # error. The dialect is not guessable from the name, which is why every one of
  # these was verified by probe, including both search-preview models.
  gpt-5:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-5"
      - provider: avalai
        model: "gpt-5"

  gpt-5-mini:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-5-mini"

  gpt-5.3-chat:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-5.3-chat"

  o1:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/o1"
      - provider: avalai
        model: "o1"

  o3:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/o3"
      - provider: avalai
        model: "o3"

  o3-mini:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/o3-mini"

  o4-mini:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/o4-mini"

  gpt-4o-search-preview:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-4o-search-preview"

  gpt-4o-mini-search-preview:
    param_style: reasoning
    serves:
      - provider: parspack
        model: "openai/gpt-4o-mini-search-preview"

  # Paid rungs that light up the moment any one of these accounts is topped up.
  #
  # A model is an identity, so each entry lists every vendor that sells it: put
  # credit on OpenRouter, or GapGPT, or AvalAI, and the same alias starts
  # serving from whichever is funded, with no config change and no redeploy.
  # While every one of them is dry the router simply falls past these to the
  # Gemini and free-tier rungs below, which costs a round trip and nothing else.
  #
  # They sit BELOW Gemini in every chain on purpose: Gemini is keyed and free
  # today, so a funded account is reached only once Gemini's quota is spent.
  claude-sonnet-5:
    serves:
      - provider: openrouter
        model: "anthropic/claude-sonnet-5"
      - provider: openrouter2
        model: "anthropic/claude-sonnet-5"
      - provider: gapgpt
        model: "claude-sonnet-5"
      - provider: anthropic
        model: "claude-sonnet-5"

  gpt-5.6-terra:
    serves:
      - provider: openrouter
        model: "openai/gpt-5.6-terra"
      - provider: openrouter2
        model: "openai/gpt-5.6-terra"

  gpt-5.6-luna:
    serves:
      - provider: openrouter
        model: "openai/gpt-5.6-luna"
      - provider: openrouter2
        model: "openai/gpt-5.6-luna"
      - provider: gapgpt
        model: "gpt-5.6-luna"

  # OpenRouter free tier — these cost nothing, so they belong at the end of
  # chains as a floor rather than a failure.
  #
  # Re-probed 2026-08-15 against both keys, and most of the catalogue did not
  # survive it. A ":free" suffix is a marketing state, not a capability: it
  # lapses, and the model keeps answering 200 with an empty body or with its
  # own reasoning where the answer belongs. Only what returned clean, non-empty
  # content is listed here.
  #
  #   inclusionai/ling-3.0-flash:free   no longer free ("the paid version is
  #                                     available now") — was the floor under
  #                                     gpt-oss-20b and had been dead there
  #   poolside/laguna-m.1:free          "No endpoints found"
  #   openai/gpt-oss-20b:free           200, empty content
  #   poolside/laguna-xs-2.1:free       200, empty content
  #   dots-studio/dots-3-note:free      200, empty content
  #   google/gemma-4-31b-it:free        provider error
  #   nvidia/nemotron-3.5-lightning     leaks its reasoning into content
  #   nvidia/nemotron-3-nano-30b        leaks its reasoning into content
  nemotron-3-ultra:
    serves:
      - provider: openrouter
        model: "nvidia/nemotron-3-ultra-550b-a55b:free"
      - provider: openrouter2
        model: "nvidia/nemotron-3-ultra-550b-a55b:free"
      - provider: parspack
        model: "nvidia/nemotron-3-ultra-preview"

  nemotron-3-super:
    serves:
      - provider: openrouter
        model: "nvidia/nemotron-3-super-120b-a12b:free"
      - provider: openrouter2
        model: "nvidia/nemotron-3-super-120b-a12b:free"

  laguna-s:
    serves:
      - provider: openrouter
        model: "poolside/laguna-s-2.1:free"
      - provider: openrouter2
        model: "poolside/laguna-s-2.1:free"


models:
  nabu-fast:
    # minimax-m2.7 is deliberately not the primary. Like kimi-k2.6 it leaks its
    # reasoning into `content` on Parspack — intermittently, which is worse than
    # always: the same prompt returns "Hi!" once and "The user asks: ..." the
    # next time, so it looks like a flaky model rather than a broken one.
    # It stays reachable as nabu-minimax.
    primary:
      model: gpt-4o-mini
    fallback:
      - model: gpt-4.1-mini
      - model: minimax-m2.7
      # Every rung above resolves to Parspack alone, and Parspack answers 402
      # once its credit runs out — which it has. The alias then returned 502 for
      # every request while a keyed Gemini and two keyed OpenRouter accounts sat
      # unused. Probed 2026-08-15: gemini-2.5-flash answers on this key,
      # gemini-2.5-pro is already 429 on it.
      - provider: gemini
        model: "gemini-2.5-flash"
      - model: gpt-5.6-luna
      - model: laguna-s


  nabu-smart:
    # kimi-k2.6 is deliberately NOT here. On Parspack it returns its reasoning
    # inline as `content` — no separate reasoning field and no delimiter to strip
    # — so a caller gets "The user says ... the persona is ..." instead of an
    # answer. It stays reachable as nabu-kimi for anyone who wants it knowingly.
    primary:
      model: gpt-5.5
    fallback:
      - model: gpt-4o
      - model: deepseek-v4-pro
      - model: gpt-4.1-mini
      # Same all-Parspack chain as nabu-fast, same 402, same outage — and this
      # is the alias NabuChat sends every message to, so the product went silent
      # with it. The last two rungs cross vendors on purpose: one Google key,
      # one OpenRouter free model that was verified answering rather than
      # assumed to.
      - provider: gemini
        model: "gemini-2.5-flash"
      - model: claude-sonnet-5
      - model: gpt-5.6-terra
      - model: nemotron-3-ultra


  nabu-cheap:
    primary:
      model: gpt-4.1-nano
    fallback:
      - model: gpt-4o-mini
      - model: gpt-oss-20b
      # gpt-oss-20b was supposed to be the free floor here and never was — its
      # `serves` entries named registry models instead of providers, so the
      # router skipped them. These rungs resolve.
      - provider: gemini
        model: "gemini-2.5-flash-lite"
      - model: gpt-5.6-luna
      - model: nemotron-3-super
      - model: laguna-s


  # Both rungs of the previous chain were dead, so the alias returned 502 for
  # every request — including plain text:
  #   - `openai/gpt-4o` was a PINNED coordinate and OPENAI_API_KEY is empty, so
  #     the router skipped it ("provider unavailable") instead of reaching the
  #     same model on a provider that is keyed.
  #   - `gemini-1.5-pro` has been retired; Google answers 404 for it.
  #
  # Naming `gpt-4o` through the registry is the fix for the first: the router
  # expands it across every provider serving that model and skips the unkeyed
  # ones, which is how nabu-smart survives the same empty OPENAI_API_KEY.
  #
  # The Gemini rung is checked against ListModels rather than assumed — that is
  # what made the old one rot silently.
  nabu-vision:
    primary:
      model: gpt-4o
    fallback:
      - provider: gemini
        model: "gemini-2.5-flash"
      # Gemini was the last rung, and on the free tier it answers 429 every
      # other call — so this alias died whenever the quota bit, with nothing
      # behind it. There is no free cross-vendor rung to offer: the one free
      # multimodal model on OpenRouter that answers text at all
      # (nemotron-3-nano-omni) returned 3KB of keepalive whitespace and no body
      # when given an image, and nemotron-nano-12b-v2-vl does not return JSON.
      # So the floor here is a paid one, and until an account is funded this
      # alias is only as reliable as Gemini's free quota.
      - model: claude-sonnet-5

  # Reading the text in an image, cheapest engine first.
  #
  # NabuOCR is Tesseract on our own hardware: no per-request cost, no data
  # leaving the building, and measured on 21 real screenshots it read 20 of them
  # locally. The one it could not was white text on a dark bubble under a
  # three-dimensional headline — which is precisely what the rungs below are for.
  #
  # The chain works because NabuOCR answers 502 when its own confidence says the
  # read is not worth passing on, rather than returning noise with a 200. A rung
  # that always succeeds is a rung nothing ever falls past.
  #
  # Inert until NABUOCR_BASE_URL names the container: with the provider absent
  # this alias starts at gpt-4o and behaves exactly as nabu-vision does today,
  # so setting it up is an improvement and leaving it unset costs nothing.
  nabu-ocr:
    primary:
      provider: nabuocr
      model: "nabu-ocr"
    fallback:
      - model: gpt-4o
      - provider: gemini
        model: "gemini-2.5-flash"

  nabu-minimax:
    primary:
      provider: dahl
      model: "MiniMaxAI/MiniMax-M2.7"
    fallback:
      # Same model, different vendor. dahl sits behind Cloudflare bot
      # protection and answers this gateway with a challenge page (HTTP 403,
      # "Just a moment..."), so the primary cannot serve anyone today. This rung
      # is verified working. It is placed FIRST because an alias named after a
      # model should try that model everywhere before giving up on it.
      - provider: openrouter2
        model: "minimax/minimax-m2.7"
      # Last resort, and a different model entirely: something is better than an
      # error, but only after MiniMax has been tried on every vendor that has it.
      - provider: groq
        model: "llama-3.1-70b-versatile"

  nabu-kimi:
    primary:
      provider: dahl
      model: "moonshotai/Kimi-K2.6"
    fallback:
      # Same model, different vendor — see nabu-minimax above for why dahl
      # cannot serve it. Verified working through this gateway.
      - provider: openrouter2
        model: "moonshotai/kimi-k2.6"
      # Last resort, and not Kimi at all.
      - provider: openai
        model: "gpt-4o"

  nabu-local:
    primary:
      provider: llamacpp
      model: "qwen-local"
    fallback:
      - provider: ollama
        model: "llama3.1"

  nabu-parspack:
    primary:
      provider: parspack
      model: "openai/gpt-5.5"
      param_style: reasoning
    fallback:
      - provider: parspack
        model: "openai/gpt-4o-2024-11-20"
      - provider: parspack
        model: "deepseek/deepseek-v4-pro"
      - provider: parspack
        model: "z-ai/glm-5.2"


  nabu-avalai:
    primary:
      provider: avalai
      model: "gpt-5.5"
    fallback:
      - provider: avalai
        model: "gemini-2.5-flash"

  nabu-gap:
    primary:
      provider: gapgpt
      model: "gpt-5.6-luna"
    fallback:
      - provider: gapgpt
        model: "claude-sonnet-5"

  nabu-arvan:
    primary:
      provider: arvan
      model: "DeepSeek-R1-qwen-7b-awq"

  # Cloudflare Workers AI-backed chat alias (or call the passthrough directly:
  # "cloudflare/@cf/<author>/<model>").
  nabu-cloudflare:
    primary:
      provider: cloudflare
      model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
    fallback:
      - provider: cloudflare
        model: "@cf/meta/llama-3.1-8b-instruct"

  # TokenRouter-backed chat alias using its smart "auto:balance" routing (or call
  # "tokenrouter/<model>" directly via passthrough, e.g. "tokenrouter/glm-5.2").
  nabu-tokenrouter:
    primary:
      provider: tokenrouter
      model: "auto:balance"
    fallback:
      - provider: tokenrouter
        model: "gpt-4o"

  # 9Router-backed alias. 9Router runs its own 3-tier fallback internally, so a
  # single target is usually enough; the model id must match something its
  # dashboard actually exposes for a connected provider.
  #
  # This is a chat alias. It spent its life under `audio:`, where a request for
  # speech was routed to a text model that cannot produce any — no key and no
  # dashboard hookup would have made that succeed.
  nabu-9router:
    primary:
      provider: 9router
      model: "anthropic/claude-3-5-sonnet-20241022"

  # gamma.app. Three aliases rather than one because the format is chosen by the
  # model name and the three are different artefacts: slides, a written
  # document, a social post.
  #
  # No fallback, deliberately, and for the same reason nabu-header has none: a
  # text model standing in for a deck returns prose where the caller asked for
  # something to present. An error is the honest answer.
  #
  # The reply is a link, not the deck itself — Gamma hosts what it makes.
  nabu-slides:
    primary:
      provider: gamma
      model: "gamma-presentation"

  nabu-doc:
    primary:
      provider: gamma
      model: "gamma-document"

  nabu-social:
    primary:
      provider: gamma
      model: "gamma-social"

images:
  nabu-image:
    primary:
      provider: openai
      model: "gpt-image-1"
    fallback:
      - provider: gemini
        model: "gemini-2.5-flash-image"
      - provider: pexels
        model: "search"

  # Stock photos only: search Pexels for the prompt (empty prompt → curated).
  nabu-photo:
    primary:
      provider: pexels
      model: "search"

  # Branded graphics from mrc_imagegen. Three aliases rather than one because
  # the canvas is chosen by the model name, and these are three different
  # shapes: 1600x900 for an article header, 1080x1350 for a feed card,
  # 1080x1920 for a story.
  #
  # No fallback on any of them. A diffusion model standing in for these would
  # return something that is not the brand — wrong typeface, wrong palette, no
  # logo — and a caller asking for a branded header would rather get an error
  # than a plausible-looking stranger's design.
  nabu-header:
    primary:
      provider: imagegen
      model: "header"

  nabu-card:
    primary:
      provider: imagegen
      model: "card"

  nabu-story:
    primary:
      provider: imagegen
      model: "story"

audio:
  nabu-voice:
    primary:
      provider: openai
      model: "gpt-4o-mini-tts"
    fallback:
      - provider: gemini
        model: "gemini-2.5-flash-preview-tts"

# ─────────────────────────── speech to text ────────────────────────────────
#
# The opposite direction to `audio:` above, and a separate section because the
# models are different and one alias cannot serve both.
#
# Why this belongs in the gateway at all: transcription used to run inside
# ReelMind as a local Whisper, which meant a CPU-bound model on an application
# box, no cost accounting, and every future caller re-solving the same problem.
# Here it is one alias with the same failover, quota and usage tracking as chat.
transcription:
  # General-purpose transcription. Multilingual and timestamped: ask for
  # `timestamp_granularities[]=segment` and the response carries the bounds
  # that turn a transcript into a citable source.
  #
  # Parspack leads because it is the only vendor keyed here today, and it gets
  # two rungs of its own — its per-model availability moves minute to minute,
  # so one rung is not a fallback chain. The rungs below it are other vendors
  # entirely; each stays inert until its key env is set, which costs nothing.
  nabu-transcribe:
    # The self-hosted engine leads because it is the only one that actually
    # serves transcription here: Parspack lists whisper-1 and gpt-4o-transcribe
    # in /models but its /audio/transcriptions answers 500 (and 502 HTML for the
    # gpt-4o one) — verified by calling Parspack directly, not through here.
    # The rungs below stay in place so the day a vendor works, it just works.
    primary:
      provider: whisper
      model: "mobiuslabsgmbh/faster-whisper-large-v3-turbo"
    fallback:
      - provider: parspack
        model: "openai/whisper-1"
      - provider: parspack
        model: "openai/gpt-4o-transcribe"
      # Genuinely different vendors, so one outage cannot take the chain with
      # it. Groq serves whisper-large-v3-turbo faster and cheaper than anyone.
      - provider: groq
        model: "whisper-large-v3-turbo"
      - provider: avalai
        model: "whisper-1"
      - provider: gapgpt
        model: "whisper-1"
      - provider: openai
        model: "whisper-1"

  # Cheapest path, for bulk work where a few percent of accuracy is worth the
  # price difference. Same shape, fewer rungs.
  nabu-transcribe-fast:
    primary:
      provider: groq
      model: "whisper-large-v3-turbo"
    fallback:
      - provider: whisper
        model: "mobiuslabsgmbh/faster-whisper-large-v3-turbo"

embeddings:
  # General-purpose embedding alias. The fallback chain deliberately crosses
  # vector widths (1536 → 768 → 1024) AND vector spaces: fine only for a search
  # that embeds the corpus and the query together in one request, wrong for
  # anything that stores the vectors — see write-embed below.
  #
  # Spaces matter independently of widths, and are the easier of the two to miss
  # because nothing fails: comparing a vector from one model against a vector
  # from another of the same width yields a number, and the number is noise.
  # Any alias backing a persisted index must have exactly one rung.
  nabu-embed:
    primary:
      provider: openai
      model: "text-embedding-3-small"
    fallback:
      # gemini-embedding-001, not text-embedding-004. Google retired the latter
      # and now answers 404 for it — verified against the live API. This file
      # already said so a few aliases down; this rung had simply not been
      # updated with the others, so the only reachable target in the whole chain
      # was a dead model name. With openai's key unset and cloudflare
      # unconfigured, that left the alias advertised on /v1/models and failing
      # every request.
      - provider: gemini
        model: "gemini-embedding-001"
      - provider: cloudflare
        model: "@cf/baai/bge-large-en-v1.5"

  # NabuDesk's knowledge + conversation index, 1536 wide.
  #
  # Its EmbeddingService checks the returned width and logs a mismatch, which is
  # better than most callers manage — and is exactly why the gemini fallback
  # that used to sit here was so dangerous. A width check passes a 1536-dim
  # gemini vector without complaint, because the problem is not the width: it is
  # that the vector belongs to a different space than everything already stored.
  # A check that can only see width certifies the one failure it cannot see.
  #
  # Single rung, so a provider outage fails the embed — retryable — instead of
  # quietly writing a second geometry into the index. See write-embed below on
  # why the primary is not moved to the multilingual model yet.
  #
  # The fallback keeps ONE geometry: it is the same OpenAI model, merely
  # proxied through OpenRouter when Parspack is out (2026-08: its wallet hit
  # 402 and desk went silent). Same weights, same space — a width check that
  # cannot certify space does not need to, because the space is identical.
  desk-embed:
    primary:
      provider: parspack
      model: "openai/text-embedding-3-small"
    fallback:
      - provider: openrouter
        model: "openai/text-embedding-3-small"

  # NabuGen's content memory — 1024 wide, matching the column its schema
  # already declares, so enabling the feature needs no re-index.
  #
  # gemini-embedding-001 emits any requested width, so the CALLER MUST SEND
  # `dimensions: 1024`. Without it the provider returns 3072 and the insert
  # fails. NabuGen currently has this feature disabled (no embedding key), so
  # this alias is ready rather than in use.
  gen-embed:
    primary:
      provider: gemini
      model: "gemini-embedding-001"

  # NabuChat's Qdrant index.
  #
  # No fallback, for the same reason as write-embed below: its Qdrant collection
  # is created at 1536 and a fallback of another width would corrupt it rather
  # than fail loudly. NabuChat's own code notes the 1536 constraint and then
  # defaults to nabu-embed, which does cross widths — hence this alias.
  # Single target, and it must stay that way. The previous fallback here
  # (parspack/text-embedding-3-small -> gemini/gemini-embedding-001) was
  # justified on the grounds that both rungs are 1536 wide, but width is not the
  # invariant — the SPACE is. Two 1536-dim models are two different geometries,
  # and cosine between a vector from one and a vector from the other is noise.
  #
  # Measured on identical text through this gateway, Persian question against
  # English passage: 3-small scores correct pairs 0.189-0.323 and gemini scores
  # them 0.663-0.691. So a corpus indexed while the primary was up and queried
  # after it fell over does not degrade — it stops meaning anything, silently,
  # with every score still looking like a plausible number.
  #
  # gemini-embedding-001 is also the only rung of the two that is actually
  # multilingual, which is what NabuChat needs: its users write Persian
  # questions about English documents. 3-small put the correct answer at 0.189
  # and the consumer's threshold at 0.25, rejecting most of what it found.
  #
  # There is no same-space fallback to offer, and that is the right outcome for
  # a STORED index: fail loudly rather than write a second geometry into a
  # collection nobody will think to suspect.
  chat-embed:
    primary:
      provider: gemini
      model: "gemini-embedding-001"

  # Zooey's semantic-memory index — 768 wide.
  #
  # Its Qdrant collection is declared at `"size": 768`, inherited from the
  # Google text-embedding-004 the code called directly before moving onto the
  # gateway. text-embedding-004 is NOT the model here: it no longer supports
  # embedContent on this key and answers 404, the same way gemini-1.5-pro rotted
  # out of nabu-vision. Probed against ListModels filtered by embedContent —
  # filtering by generateContent, which is the obvious mistake, lists models
  # that cannot embed at all.
  #
  # Switching models is safe only because nothing has been indexed yet: Zooey's
  # QDRANT_URL points at a host that does not exist in its stack, so the feature
  # has never run in production and there is no corpus to split. Once it does
  # run, this model is fixed — a different one writes into a different semantic
  # space at the same width, which no error would reveal.
  #
  # No fallback, deliberately — and note this is the one place the
  # cross-vendor-fallback rule does NOT apply.
  #
  # That rule is about availability: two models behind one key share an outage,
  # so a chat alias must end on a different vendor. For a STORED index the
  # binding constraint is different and stricter. Zooey's existing vectors were
  # produced by text-embedding-004. Any other model writes into a different
  # semantic space, so a fallback would keep the width valid while quietly
  # making half the corpus unsearchable against the other half — no failed
  # insert, no error, just retrieval that slowly stops working.
  #
  # Matching the width is necessary and not sufficient: same width, different
  # model is still a split corpus. write-embed reaches the same conclusion.
  #
  # A failed embed is a retryable error. A wrong-model vector is a corrupt index
  # that nothing detects.
  #
  # Zooey still sends `dimensions: 768` on every request and verifies the
  # returned length before inserting, as a second line of defence.
  # gemini-embedding-001 emits whatever width is asked for and defaults to 3072,
  # so this is only 768 because Zooey sends `dimensions: 768` on every request
  # and refuses any response of another length before storing it.
  zooey-embed:
    primary:
      provider: gemini
      model: "gemini-embedding-001"

  # NabuWrite's Style RAG index.
  #
  # No fallback, deliberately. NabuWrite stores these vectors in a fixed-width
  # pgvector column. A fallback of a different width would either fail the
  # insert or — worse — split the corpus across two incompatible embedding
  # spaces with no error at all. A failed embed is a retryable error; a
  # wrong-width vector is a corrupt index.
  #
  # Routed through Parspack because it is the provider actually keyed on this
  # deployment, and text-embedding-3-small is natively 1536-wide, so the
  # client's requested `dimensions` and the model's default agree.
  # The gemini fallback that used to sit here is gone, and the comment above is
  # the reason: it named the exact hazard — "split the corpus across two
  # incompatible embedding spaces with no error at all" — and then a later
  # change added a rung that does precisely that, on the grounds that both are
  # 1536 wide. Width was never the invariant. Measured through this gateway,
  # correct pairs score 0.189-0.323 under 3-small and 0.663-0.691 under
  # gemini-embedding-001: the two do not share a geometry, so a corpus written
  # partly by each means nothing.
  #
  # The primary is left alone rather than moved to the multilingual model, which
  # would be the better model here too. NabuWrite's index was written by
  # 3-small, and NabuWrite has no way to notice that its stored vectors came
  # from a different model — NabuChat only found out because its loader now
  # hashes the resolved embedding space. Switching this before NabuWrite can
  # detect it would silently strand its corpus.
  write-embed:
    primary:
      provider: parspack
      model: "openai/text-embedding-3-small"

# Sub-agents (system prompt + defaults over an alias, addressable as a "model").
# The Cinematic Scrollytelling squad ships as one YAML file per agent under
# /app/agents in the image (./agents in the repo). Add your own inline under an
# `agents:` map or as more files in this directory. Grant with allow: ["cine-*"].
agents_dir: "/app/agents"

# Flows: named chains of agents, each step handed what the one before it made.
# Addressable as a "model" exactly like an agent, so one request runs the chain.
flows_dir: "/app/flows"

pricing:
  "openai/gpt-4o": { input: 2.5, output: 10 }
  "openai/gpt-4o-mini": { input: 0.15, output: 0.6 }
  "openai/text-embedding-3-small": { input: 0.02, output: 0 }
  "anthropic/claude-3-5-sonnet-latest": { input: 3, output: 15 }
  "anthropic/claude-3-5-haiku-latest": { input: 0.8, output: 4 }
  "gemini/gemini-1.5-pro": { input: 1.25, output: 5 }
  "groq/llama-3.1-70b-versatile": { input: 0.59, output: 0.79 }
