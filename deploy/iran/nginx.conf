# Optional. Use this only on a machine where nothing else owns ports 80/443.
# The Iran server runs Coolify, so the file to deploy there is
# docker-compose.yml (nginx-coolify.conf). This one terminates TLS itself.
#
# Drop this file in /etc/nginx/sites-available/gate.nabuxai.ir and symlink it
# into sites-enabled. The stock nginx.conf includes that directory from inside
# http {}, which is where the map below has to live. Do not nest this file
# inside another server block.
#
# Browsers talk only to gate.nabuxai.ir. This server opens
# https://gate.nabuxai.com with that name as SNI and Host, and tells the
# upstream which host the browser used. The upstream Host must stay
# gate.nabuxai.com or the certificate check fails.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name gate.nabuxai.ir;

    # certbot renew --webroot needs this path. Everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://gate.nabuxai.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gate.nabuxai.ir;

    ssl_certificate     /etc/letsencrypt/live/gate.nabuxai.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gate.nabuxai.ir/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:nabu_ssl:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Audio uploads (transcription) are the large bodies. 100m covers a long
    # recording without accepting an unbounded request.
    client_max_body_size 100m;

    # SSE and streamed chat must leave this box as the upstream writes them.
    # gzip here would buffer a stream into a whole response.
    gzip off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;

    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;

    location / {
        proxy_pass https://gate.nabuxai.com;
        proxy_ssl_server_name on;
        proxy_ssl_name gate.nabuxai.com;

        # Upstream vhost and certificate. Not the mirror's name.
        proxy_set_header Host gate.nabuxai.com;

        # What the browser actually used. The gateway builds OAuth redirect
        # URIs, payment return URLs and the Secure cookie flag from these.
        # Overwrite rather than append: a client-supplied X-Forwarded-For
        # must not become the address the gateway rate-limits.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # Let the upstream see Accept-Encoding so it can send its own
        # precompressed .br/.gz assets. Do not recompress them here.
        proxy_set_header Accept-Encoding $http_accept_encoding;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
