[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nabugate"
version = "1.0.0"
description = "Official Python SDK for NabuGate, the OpenAI-compatible AI gateway"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "NabuX Team", email = "support@nabuxai.com" }]
license = { text = "MIT" }
keywords = ["nabugate", "ai", "llm", "openai", "gateway", "embeddings", "text-to-speech"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["requests>=2.28.0"]

[project.urls]
Homepage = "https://gate.nabuxai.com"
Source = "https://github.com/nabuxai/NabuGate/tree/main/packages/python"
Issues = "https://github.com/nabuxai/NabuGate/issues"

[tool.hatch.build.targets.wheel]
packages = ["nabugate"]
