[package]
name = "nabugate-rs"
version = "1.0.0"
edition = "2021"
description = "Official Rust SDK for NabuGate AI & Voice Gateway"
license = "MIT"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
