[package]
name = "nabugate"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Official Rust SDK for NabuGate, the OpenAI-compatible AI gateway"
license = "MIT"
readme = "README.md"
homepage = "https://gate.nabuxai.com"
repository = "https://github.com/nabuxai/NabuGate"
documentation = "https://docs.rs/nabugate"
keywords = ["nabugate", "ai", "llm", "openai", "gateway"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = { version = "0.3", default-features = false }
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
