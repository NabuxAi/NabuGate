# Temporary helper for the Claude gateway feature branch only.
# Rebuild the committed static bundle after the source changes.
# Remove this workflow in a follow-up commit after the build.
name: Build Claude PR web bundle
on:
  push:
    branches:
      - feature/iran-claude-gateway-guide-2026

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies and build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Commit rebuilt static assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A web/dist web/src.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'build(web): refresh Claude gateway static bundle'
            git push origin HEAD:feature/iran-claude-gateway-guide-2026
          fi
